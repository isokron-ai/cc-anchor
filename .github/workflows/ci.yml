name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install jq and shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q jq shellcheck
      - name: Lint
        run: npm run lint
      - name: Install the real sea-lite and kronicle-lite CLIs for the contract tests
        run: npm install --no-save --no-package-lock sea-lite@^0.4.0 kronicle-lite@0.7.0
      - name: Test
        run: npm test
      - name: Wall-clock budget tests (informational, non-blocking)
        continue-on-error: true
        run: CC_ANCHOR_PERF_TESTS=1 node --test --test-name-pattern="less than 50 ms|stays under budget|cached verdict path is fast" tests/hooks.test.mjs
      - name: Hook hot-path timing
        run: |
          mkdir -p /tmp/proj/.git
          payload='{"session_id":"ci","cwd":"/tmp/proj","hook_event_name":"PostToolUse","tool_name":"Read","tool_input":{"file_path":"/tmp/proj/README.md"},"tool_response":{}}'
          export CLAUDE_PROJECT_DIR=/tmp/proj
          for i in 1 2 3; do echo "$payload" | bash scripts/post-tool-use.sh; done
          start=$(date +%s%N); for i in $(seq 10); do echo "$payload" | bash scripts/post-tool-use.sh; done; end=$(date +%s%N)
          echo "PostToolUse mean: $(( (end - start) / 10000000 )) ms"
          pre='{"session_id":"ci","cwd":"/tmp/proj","hook_event_name":"PreToolUse","tool_name":"Edit","tool_input":{"file_path":"/tmp/proj/src/a.ts","old_string":"a","new_string":"b"}}'
          start=$(date +%s%N); for i in $(seq 10); do echo "$pre" | bash scripts/pre-tool-use.sh; done; end=$(date +%s%N)
          echo "PreToolUse (scope guard off) mean: $(( (end - start) / 10000000 )) ms"
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/sea-lite && chmod +x /tmp/sea-lite   # timing only; the contract is tested against the real CLI
          export CC_ANCHOR_SCOPE_GUARD=1 CC_ANCHOR_SEA_LITE_BIN=/tmp/sea-lite
          echo "$pre" | bash scripts/pre-tool-use.sh
          start=$(date +%s%N); for i in $(seq 10); do echo "$pre" | bash scripts/pre-tool-use.sh; done; end=$(date +%s%N)
          echo "PreToolUse (scope guard on, cached verdict) mean: $(( (end - start) / 10000000 )) ms"
          bash_pre='{"session_id":"ci","cwd":"/tmp/proj","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"./bin/deploy --target x"}}'
          start=$(date +%s%N); for i in $(seq 10); do echo "$bash_pre" | bash scripts/pulse.sh; done; end=$(date +%s%N)
          echo "PreToolUse pulse (kronicle-lite not configured) mean: $(( (end - start) / 10000000 )) ms"
          cat /tmp/proj/.claude/anchor.md

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace (strict, directory profile)
        run: claude plugin validate --strict --profile directory .

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install jq
        run: brew install jq
      - name: Install the real sea-lite and kronicle-lite CLIs for the contract tests
        run: npm install --no-save --no-package-lock sea-lite@^0.4.0 kronicle-lite@0.7.0
      - name: Which bash the hooks get
        run: which -a bash || true; bash --version | head -1; /bin/bash --version | head -1
      - name: Test on macOS (BSD date, /bin/bash 3.2)
        run: npm test
